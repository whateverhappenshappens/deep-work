<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Work Slots</title>
  <style>
    :root{
      --bg:#0b1020;          /* deep navy */
      --card:#131a33;        /* slate indigo */
      --muted:#8b93b7;       /* soft gray-blue */
      --text:#e9edff;        /* near-white */
      --accent:#7aa2ff;      /* blue */
      --accent-2:#6ee7b7;    /* mint */
      --danger:#ff6b6b;
      --warn:#ffd166;
      --ok:#86efac;
      --ring:#263159;
      --shadow:0 6px 24px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.25);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background:linear-gradient(180deg, #0b1020 0%, #0f1630 100%);
      color:var(--text);
    }
    a{color:var(--accent)}

    .container{max-width:1100px;margin:0 auto;padding:24px}

    header{
      display:flex;gap:16px;align-items:center;justify-content:space-between;
      position:sticky;top:0;background:linear-gradient(180deg, rgba(11,16,32,.9) 0%, rgba(15,22,48,.7) 100%);
      backdrop-filter: blur(8px);z-index:10;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.06);
    }
    .brand{display:flex;gap:12px;align-items:center}
    .logo{
      width:36px;height:36px;border-radius:10px;background:radial-gradient(70% 70% at 30% 30%, var(--accent) 0, #5b7cff 45%, #2948ff 100%);
      box-shadow: inset 0 0 10px rgba(255,255,255,.15), 0 4px 18px rgba(122,162,255,.35);
    }
    .brand h1{font-size:18px;margin:0;letter-spacing:.3px}

    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

    .btn{
      background:#1b2447;color:var(--text);border:1px solid rgba(255,255,255,.08);
      padding:10px 14px;border-radius:12px;cursor:pointer;
      transition: transform .06s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{background:#222c54}
    .btn:active{transform:translateY(1px)}
    .btn.primary{background:linear-gradient(180deg,#7aa2ff,#4776ff);border-color:#6c8dff}
    .btn.ghost{background:transparent;border-color:rgba(255,255,255,.15)}
    .btn.warn{background:linear-gradient(180deg,#ffd166,#ffaa00);color:#141414;border-color:#e1a900}
    .btn.danger{background:linear-gradient(180deg,#ff8f8f,#ff5e5e);border-color:#ff8f8f}

    .stack{display:flex;gap:8px;flex-wrap:wrap}
    .spacer{flex:1}

    .input, select{
      background:#121938;border:1px solid rgba(255,255,255,.1);color:var(--text);
      padding:10px 12px;border-radius:10px;outline:none;min-width:0
    }
    .input::placeholder{color:#a2a9cc}

    .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
    @media (max-width:860px){.grid{grid-template-columns:1fr}}

    .card{
      background:linear-gradient(180deg, #121938 0%, #0f1734 100%);
      border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);box-shadow:var(--shadow);
      padding:16px;display:flex;gap:14px;flex-direction:column;position:relative
    }

    .card-header{display:flex;gap:10px;align-items:center}
    .title{font-weight:700;letter-spacing:.2px}
    .desc{color:var(--muted);font-size:14px}

    .meta{display:flex;gap:10px;flex-wrap:wrap;color:#b8c1ee;font-size:13px}
    .meta .pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:6px 10px;border-radius:999px}

    .progress{
      display:flex;align-items:center;gap:16px
    }

    .ring{width:120px;height:120px;}
    .ring text{font-size:16px;fill:var(--text);font-weight:600}

    .controls{display:flex;flex-wrap:wrap;gap:8px}

    .tasks{border-top:1px dashed rgba(255,255,255,.1);padding-top:10px}
    .tasks h4{margin:0 0 8px 0;font-size:13px;color:#cbd5ff;letter-spacing:.2px}
    .task-item{display:flex;gap:10px;align-items:center;padding:6px 0}
    .task-item input[type="text"]{flex:1}
    .task-text.done{text-decoration:line-through;color:#94a3b8}
    .task-actions{margin-left:auto;display:flex;gap:6px}

    .small{font-size:12px;color:#9fb2ff}
    .muted{color:var(--muted)}

    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111a39;border:1px solid rgba(255,255,255,.12);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);display:none}

    footer{margin:24px 0;color:#95a1d9;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:8px 10px;border-radius:10px}

    /* Inline form */
    .new-slot{display:grid;grid-template-columns:1.2fr .6fr .6fr .6fr .8fr auto;gap:8px}
    @media (max-width:900px){
      .new-slot{grid-template-columns:1fr 1fr}
    }
    .hint{font-size:12px;color:#9fb2ff;margin-top:-6px}
  </style>
</head>
<body>
  <header class="container">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <h1>Deep Work Slots</h1>
    </div>
    <div class="toolbar">
      <input type="date" id="datePicker" class="input" />
      <button class="btn ghost" id="exportBtn">Export Backup</button>
      <label class="btn ghost" for="importFile">Import Backup</label>
      <input id="importFile" type="file" accept="application/json" hidden />
      <button class="btn" id="notifBtn" title="Enable system notifications">Enable Notifications</button>
      <button class="btn warn" id="presetsBtn" title="Add quick presets">+ Quick Presets</button>
      <button class="btn danger" id="clearDayBtn" title="Delete all slots for this day">Clear Day</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="bar" style="align-items:flex-start;gap:12px">
        <input id="slotName" class="input" placeholder="Slot name (e.g., LLM research)" />
        <input id="slotDesc" class="input" placeholder="Description / focus" />
        <input id="slotDuration" class="input" type="time" step="60" value="01:00" title="Duration (HH:MM)" />
        <input id="breakEvery" class="input" type="number" min="0" step="5" value="60" title="Break reminder in minutes (0 = off)" />
        <button id="addSlotBtn" class="btn primary">Add Slot</button>
      </div>
      <div class="hint">Tip: Use presets (25m · 50m · 90m) via the "Quick Presets" button. Break reminder 0 = off.</div>
    </section>

    <section class="grid" id="slotGrid"></section>

    <footer>
      <div class="stat" id="statPlanned">Planned: 0</div>
      <div class="stat" id="statCompleted">Completed: 0</div>
      <div class="stat" id="statElapsed">Elapsed today: 0m</div>
      <div class="spacer"></div>
      <div class="small">All data stays in your browser (LocalStorage). No cloud.</div>
    </footer>
  </main>

  <div class="toast" id="toast"></div>

  <script>
  // --------------- Utilities ---------------
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const fmtMs = (ms)=>{
    const neg = ms < 0; ms = Math.abs(ms);
    const h=Math.floor(ms/3600000); const m=Math.floor((ms%3600000)/60000); const s=Math.floor((ms%60000)/1000);
    const mm = (h>0? String(m).padStart(2,'0'): m).toString();
    const base = (h>0? `${h}:${mm}:${String(s).padStart(2,'0')}`: `${m}:${String(s).padStart(2,'0')}`);
    return neg? `+${base}`: base;
  }
  const toMsFromHHMM=(hhmm)=>{const [h,m]=hhmm.split(":").map(Number);return (h*60+m)*60000}
  const todayStr=()=> new Date().toISOString().slice(0,10);
  const uid=()=> 's_'+Math.random().toString(36).slice(2,8);
  const tone=()=>{try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();o.type='sine';o.frequency.value=880; o.connect(g); g.connect(a.destination); g.gain.value=.001; o.start(); g.gain.exponentialRampToValueAtTime(0.2,a.currentTime+.01); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+.25); o.stop(a.currentTime+.3)}catch(e){/* ignore */}}

  function toast(msg){const el=$('#toast'); el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>{el.style.display='none'},2200)}

  // Notification permission
  async function ensureNotif(){
    if(!('Notification' in window)) return false;
    if(Notification.permission==='granted') return true;
    if(Notification.permission==='denied') return false;
    const p = await Notification.requestPermission();
    return p==='granted';
  }
  function notify(title, body){
    if(!('Notification' in window)) return; 
    if(Notification.permission==='granted'){ new Notification(title,{ body }); }
  }

  // --------------- State ---------------
  const LS_KEY='deepwork_v1';
  const State = {
    data: { activeDate: todayStr(), slots: {}, ui: { lastActiveSlotId: null } },
    load(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        if(raw){ this.data = JSON.parse(raw); }
        if(!this.data.activeDate) this.data.activeDate = todayStr();
        if(!this.data.slots) this.data.slots = {};
        if(!this.data.ui) this.data.ui = { lastActiveSlotId: null };
      }catch(e){ console.warn('Resetting corrupt storage'); localStorage.removeItem(LS_KEY); }
    },
    save(){ localStorage.setItem(LS_KEY, JSON.stringify(this.data)); },
    getDay(date){ return this.data.slots[date] || []; },
    setDay(date, arr){ this.data.slots[date] = arr; this.save(); },
  }

  // Single running guard
  function pauseAllExcept(id){
    const list = State.getDay(State.data.activeDate);
    let changed=false;
    for(const s of list){
      if(s.id!==id && s.timer.status==='running'){
        s.timer.status='paused';
        s.timer.elapsedMs = (s.timer.elapsedMs||0) + (Date.now() - (s.timer.startedAt||Date.now()));
        s.timer.startedAt = null;
        changed=true;
      }
    }
    if(changed) State.save();
  }

  // --------------- Rendering ---------------
  const grid = $('#slotGrid');
  function render(){
    $('#datePicker').value = State.data.activeDate;
    const list = State.getDay(State.data.activeDate);
    // Stats
    $('#statPlanned').textContent = `Planned: ${list.length}`;
    $('#statCompleted').textContent = `Completed: ${list.filter(s=>s.timer.status==='done').length}`;
    const elapsed = list.reduce((acc,s)=> acc + (s.timer.status==='running' ? ((s.timer.elapsedMs||0) + (Date.now()-(s.timer.startedAt||Date.now()))) : (s.timer.elapsedMs||0)), 0);
    $('#statElapsed').textContent = `Elapsed today: ${Math.round(elapsed/60000)}m`;

    grid.innerHTML='';
    list.forEach(slot=> grid.appendChild(renderCard(slot)) );
  }

  function renderCard(slot){
    const card = document.createElement('article');
    card.className='card'; card.dataset.id=slot.id;

    const header = document.createElement('div');
    header.className='card-header';
    const title = document.createElement('div'); title.className='title'; title.contentEditable = true; title.textContent = slot.name||'Untitled';
    title.addEventListener('blur',()=>{ slot.name = title.textContent.trim(); State.save(); })
    const desc = document.createElement('div'); desc.className='desc'; desc.contentEditable=true; desc.textContent = slot.desc||'';
    desc.addEventListener('blur',()=>{ slot.desc = desc.textContent.trim(); State.save(); })
    header.append(title); header.append(desc);

    const meta = document.createElement('div'); meta.className='meta';
    const dur = document.createElement('div'); dur.className='pill'; dur.textContent = `Duration ${(slot.durationMs/60000)|0}m`;
    const br = document.createElement('div'); br.className='pill'; br.textContent = slot.breakEveryMs? `Break ${Math.round(slot.breakEveryMs/60000)}m` : 'Break off';
    const st = document.createElement('div'); st.className='pill'; st.textContent = `Status ${slot.timer.status}`;
    meta.append(dur, br, st);

    // Progress Ring
    const prog = document.createElement('div'); prog.className='progress';
    const ring = ringSVG(slot); prog.appendChild(ring);

    const controls = document.createElement('div'); controls.className='controls';
    const btnStart = btn('Start', ()=> startSlot(slot.id));
    const btnPause = btn('Pause', ()=> pauseSlot(slot.id));
    const btnResume= btn('Resume',()=> resumeSlot(slot.id));
    const btnRestart= btn('Restart',()=> restartSlot(slot.id));
    const btnDone = btn('Complete',()=> completeSlot(slot.id)); btnDone.classList.add('btn','ok')
    const btnDel = btn('Delete', ()=> deleteSlot(slot.id)); btnDel.classList.add('danger');

    controls.append(btnStart, btnPause, btnResume, btnRestart, btnDone, btnDel);

    // Tasks
    const tasks = document.createElement('div'); tasks.className='tasks';
    const th = document.createElement('h4'); th.textContent='Tasks'; tasks.appendChild(th);

    const addRow = document.createElement('div'); addRow.className='task-item';
    const addInput = document.createElement('input'); addInput.className='input'; addInput.placeholder='New task...';
    const addBtn = document.createElement('button'); addBtn.className='btn'; addBtn.textContent='Add';
    addBtn.onclick=()=>{ const txt=addInput.value.trim(); if(!txt) return; slot.tasks.push({id:uid(), text:txt, done:false}); addInput.value=''; State.save(); render(); }
    addInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ addBtn.click(); } })
    addRow.append(addInput, addBtn);

    const list = document.createElement('div');
    for(const t of slot.tasks){
      const row = document.createElement('div'); row.className='task-item';
      const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=t.done; cb.onchange=()=>{ t.done = cb.checked; State.save(); row.querySelector('.task-text').classList.toggle('done', t.done); }
      const txt = document.createElement('input'); txt.type='text'; txt.className='input task-text'; txt.value=t.text; if(t.done) txt.classList.add('done');
      txt.onblur=()=>{ t.text = txt.value.trim(); State.save(); }
      const del = document.createElement('button'); del.className='btn danger'; del.textContent='×'; del.title='Remove task'; del.onclick=()=>{ slot.tasks = slot.tasks.filter(x=>x.id!==t.id); State.save(); render(); }
      row.append(cb, txt, del); list.appendChild(row);
    }

    tasks.append(addRow, list);

    card.append(header, meta, prog, controls, tasks);
    return card;
  }

  function btn(label, onClick){ const b=document.createElement('button'); b.className='btn'; b.textContent=label; b.onclick=onClick; return b }

  function ringSVG(slot){
    const wrap = document.createElementNS('http://www.w3.org/2000/svg','svg');
    wrap.setAttribute('viewBox','0 0 120 120'); wrap.classList.add('ring');
    const cx=60, cy=60, r=52; const C=2*Math.PI*r;
    const bg = document.createElementNS('http://www.w3.org/2000/svg','circle');
    bg.setAttribute('cx',cx); bg.setAttribute('cy',cy); bg.setAttribute('r',r); bg.setAttribute('fill','none'); bg.setAttribute('stroke','var(--ring)'); bg.setAttribute('stroke-width','10');
    const fg = document.createElementNS('http://www.w3.org/2000/svg','circle');
    fg.setAttribute('cx',cx); fg.setAttribute('cy',cy); fg.setAttribute('r',r); fg.setAttribute('fill','none'); fg.setAttribute('stroke','url(#grad)'); fg.setAttribute('stroke-width','10'); fg.setAttribute('stroke-linecap','round'); fg.setAttribute('transform','rotate(-90 60 60)'); fg.setAttribute('stroke-dasharray',C); fg.setAttribute('stroke-dashoffset',C);

    const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
    const lg = document.createElementNS('http://www.w3.org/2000/svg','linearGradient'); lg.id='grad'; lg.setAttribute('x1','0%'); lg.setAttribute('y1','0%'); lg.setAttribute('x2','0%'); lg.setAttribute('y2','100%');
    const s1 = document.createElementNS('http://www.w3.org/2000/svg','stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','var(--accent)');
    const s2 = document.createElementNS('http://www.w3.org/2000/svg','stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color','#4fd1c5');
    lg.append(s1,s2); defs.append(lg);

    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x',cx); text.setAttribute('y',cy); text.setAttribute('text-anchor','middle'); text.setAttribute('dominant-baseline','central');

    wrap.append(defs, bg, fg, text);

    function update(){
      let elapsed = slot.timer.elapsedMs||0;
      if(slot.timer.status==='running') elapsed += Date.now() - (slot.timer.startedAt||Date.now());
      const total = Math.max(1, slot.durationMs||1);
      const p = Math.min(1, Math.max(0, elapsed/total));
      const rem = total - elapsed;
      fg.setAttribute('stroke-dashoffset', String(C*(1-p)) );
      text.textContent = (rem>=0? fmtMs(rem): `Over ${fmtMs(rem)}`);

      // color cue
      if(rem <= 0) {
        fg.setAttribute('stroke','var(--ok)');
      }
    }
    update();
    wrap._update = update;
    return wrap;
  }

  // --------------- Actions ---------------
  function addSlot(fields){
    const date = State.data.activeDate;
    const list = State.getDay(date).slice();
    list.push({
      id: uid(),
      name: fields.name||'Untitled',
      desc: fields.desc||'',
      durationMs: fields.durationMs||3600000,
      breakEveryMs: fields.breakEveryMs||0,
      tasks: [],
      timer: { status:'idle', startedAt:null, elapsedMs:0, lastBreakIndex:0 }
    });
    State.setDay(date, list); render();
  }

  function findSlot(id){ return State.getDay(State.data.activeDate).find(s=>s.id===id); }

  function startSlot(id){
    const s=findSlot(id); if(!s) return;
    if(s.timer.status==='done') s.timer={status:'idle', startedAt:null, elapsedMs:0, lastBreakIndex:0};
    pauseAllExcept(id);
    s.timer.status='running'; s.timer.startedAt=Date.now(); State.data.ui.lastActiveSlotId=id; State.save(); render();
  }
  function pauseSlot(id){ const s=findSlot(id); if(!s) return; if(s.timer.status!=='running') return; s.timer.elapsedMs += Date.now()-s.timer.startedAt; s.timer.startedAt=null; s.timer.status='paused'; State.save(); render(); }
  function resumeSlot(id){ const s=findSlot(id); if(!s) return; pauseAllExcept(id); if(s.timer.status==='paused' || s.timer.status==='idle'){ s.timer.status='running'; s.timer.startedAt=Date.now(); State.data.ui.lastActiveSlotId=id; State.save(); render(); } }
  function restartSlot(id){ const s=findSlot(id); if(!s) return; s.timer={status:'idle', startedAt:null, elapsedMs:0, lastBreakIndex:0}; State.save(); render(); }
  function completeSlot(id){ const s=findSlot(id); if(!s) return; s.timer.elapsedMs = s.durationMs; s.timer.startedAt=null; s.timer.status='done'; State.save(); tone(); toast('Slot completed'); render(); }
  function deleteSlot(id){ const list=State.getDay(State.data.activeDate).filter(s=>s.id!==id); State.setDay(State.data.activeDate, list); render(); }

  function clearDay(){ if(confirm('Delete all slots for this day?')){ State.setDay(State.data.activeDate, []); render(); } }

  // --------------- Ticker ---------------
  let rafId=null; let lastTick=0;
  function tick(ts){
    rafId = requestAnimationFrame(tick);
    if(!lastTick) lastTick=ts;
    if(ts - lastTick < 200) return; // logical tick ~5/s
    lastTick=ts;

    const list = State.getDay(State.data.activeDate);
    let changed=false;
    for(const s of list){
      if(s.timer.status==='running'){
        // Break reminder
        if(s.breakEveryMs>0){
          const elapsed = (s.timer.elapsedMs||0) + (Date.now() - (s.timer.startedAt||Date.now()));
          const idx = Math.floor(elapsed / s.breakEveryMs);
          if(idx > (s.timer.lastBreakIndex||0)){
            s.timer.lastBreakIndex = idx; changed=true;
            tone(); toast(`Break time for "${s.name}"`); notify('Break reminder', `Take a short break from ${s.name}`);
          }
        }
      }
    }
    if(changed) State.save();

    // update rings without full re-render
    $$('.card').forEach(card=>{
      const id = card.dataset.id; const s = findSlot(id); if(!s) return;
      const svg = card.querySelector('svg.ring'); if(svg && svg._update) svg._update();
      const statusPill = card.querySelector('.meta .pill:nth-child(3)'); if(statusPill) statusPill.textContent = `Status ${s.timer.status}`;
    })

    // auto-complete when elapsed >= duration
    let saveNeeded=false;
    for(const s of list){
      if(s.timer.status==='running'){
        const elapsed = (s.timer.elapsedMs||0) + (Date.now() - (s.timer.startedAt||Date.now()));
        if(elapsed >= s.durationMs){
          s.timer.elapsedMs = s.durationMs; s.timer.startedAt=null; s.timer.status='done';
          tone(); toast(`Completed "${s.name}"`); notify('Slot completed', `${s.name}`);
          saveNeeded=true;
        }
      }
    }
    if(saveNeeded) State.save();

    // Update stats
    const elapsed = list.reduce((acc,s)=> acc + (s.timer.status==='running' ? ((s.timer.elapsedMs||0) + (Date.now()-(s.timer.startedAt||Date.now()))) : (s.timer.elapsedMs||0)), 0);
    $('#statElapsed').textContent = `Elapsed today: ${Math.round(elapsed/60000)}m`;
  }

  // --------------- Import / Export ---------------
  function exportBackup(){
    const data = localStorage.getItem(LS_KEY);
    if(!data){ toast('Nothing to export'); return; }
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download = `deepwork_backup_${todayStr()}.json`; a.click(); URL.revokeObjectURL(url);
    toast('Backup downloaded');
  }
  function importBackup(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const json = JSON.parse(e.target.result);
        localStorage.setItem(LS_KEY, JSON.stringify(json));
        toast('Backup restored');
        State.load(); render();
      }catch(err){ alert('Invalid backup file.'); }
    };
    reader.readAsText(file);
  }

  // --------------- Presets ---------------
  function addPreset(name, minutes, breakMin){ addSlot({name, desc:'', durationMs: minutes*60000, breakEveryMs: breakMin? breakMin*60000: 0}); }

  // --------------- Event bindings ---------------
  function bindUI(){
    $('#datePicker').addEventListener('change', (e)=>{ State.data.activeDate = e.target.value; if(!State.data.slots[State.data.activeDate]) State.data.slots[State.data.activeDate]=[]; State.save(); render(); })
    $('#addSlotBtn').onclick=()=>{
      const name=$('#slotName').value.trim();
      const desc=$('#slotDesc').value.trim();
      const duration = toMsFromHHMM($('#slotDuration').value||'01:00');
      const breakEvery = Math.max(0, parseInt($('#breakEvery').value||'0',10))*60000;
      addSlot({name, desc, durationMs:duration, breakEveryMs:breakEvery});
      $('#slotName').value=''; $('#slotDesc').value='';
    }
    $('#exportBtn').onclick=exportBackup;
    $('#importFile').addEventListener('change',(e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=''; })
    $('#notifBtn').onclick=async()=>{ const ok=await ensureNotif(); toast(ok?'Notifications enabled':'Notifications unavailable'); }
    $('#clearDayBtn').onclick=clearDay;
    $('#presetsBtn').onclick=()=>{
      addPreset('Pomodoro 25', 25, 25);
      addPreset('Deep 50', 50, 50);
      addPreset('Focus 90', 90, 45);
      toast('Added 3 presets');
      render();
    }
    // Keyboard: Space toggles last active slot
    window.addEventListener('keydown',(e)=>{
      if(e.target.tagName==='INPUT' || e.target.isContentEditable) return;
      if(e.code==='Space'){
        e.preventDefault();
        const id = State.data.ui.lastActiveSlotId; if(!id) return;
        const s=findSlot(id); if(!s) return;
        if(s.timer.status==='running') pauseSlot(id); else resumeSlot(id);
      }
    })
  }

  // --------------- Init ---------------
  State.load();
  if(!State.data.slots[State.data.activeDate]) State.data.slots[State.data.activeDate]=[];
  $('#datePicker').value = State.data.activeDate;
  bindUI(); render();
  rafId = requestAnimationFrame(tick);

  // Save on unload
  window.addEventListener('beforeunload', ()=> State.save());
  </script>
</body>
</html>
